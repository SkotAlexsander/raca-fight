<title>Ícones Academia Plus</title>
<!-- Gerado por fonte/gerar.py a partir de fonte/galeria-modelo.html. Abre por file://: o sprite está embutido. -->
<style>
  :root {
    /* cores de tokens.json 1.5.0; --r-* são locais do agente R e o Q leva para o tokens.json */
    --c-fundo: #F4F8F7; --c-superficie: #FFFFFF; --c-texto: #131D1C; --c-texto-2: #556463; --c-borda: #D0DAD9; --c-marca: #007761;
    --r-ilustracao-fundo: #E6F1EF; --r-ilustracao-traco: #131D1C; --ilustracao-destaque: #007761; /* tokens 1.7.0: ilustracao.claro.destaque = marca */
    --e-fundo: #070C0C; --e-superficie: #121A19; --e-texto: #E9F2F1; --e-texto-2: #A3B1B0; --e-borda: #2A3433; --e-marca: #39F0CD;
    --er-ilustracao-fundo: #222D2C; --er-ilustracao-traco: #E9F2F1; --er-ilustracao-destaque: #39F0CD;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.45 Figtree, "Segoe UI", system-ui, sans-serif; background: #E9EEED; color: #131D1C; }
  header { padding: 24px 16px 8px; max-width: 1400px; margin: 0 auto; }
  h1 { font-size: 26px; margin: 0 0 4px; }
  h2 { font-size: 19px; margin: 28px 0 10px; }
  header p { margin: 0; color: #556463; max-width: 70ch; }
  main { max-width: 1400px; margin: 0 auto; padding: 0 16px 48px; }
  .temas { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 900px) { .temas { grid-template-columns: 1fr; } }
  .tema { border-radius: 16px; padding: 14px; }
  .claro { background: var(--c-fundo); color: var(--c-texto); --sup: var(--c-superficie); --t2: var(--c-texto-2); --bd: var(--c-borda); --mc: var(--c-marca); }
  .escuro { background: var(--e-fundo); color: var(--e-texto); --sup: var(--e-superficie); --t2: var(--e-texto-2); --bd: var(--e-borda); --mc: var(--e-marca);
    --r-ilustracao-fundo: var(--er-ilustracao-fundo); --r-ilustracao-traco: var(--er-ilustracao-traco); --ilustracao-destaque: var(--er-ilustracao-destaque); }
  .tema > b { display: block; font-size: 13px; color: var(--t2); margin-bottom: 8px; text-transform: uppercase; letter-spacing: .06em; }
  svg.i { display: block; flex: none; }
  .grade { display: grid; grid-template-columns: repeat(auto-fill, minmax(148px, 1fr)); gap: 8px; }
  .cel { background: var(--sup); border-radius: 12px; padding: 10px; }
  .cel .tam { display: flex; align-items: flex-end; gap: 12px; min-height: 34px; }
  .cel small { display: block; margin-top: 6px; font-size: 12px; color: var(--t2); }
  .cel .cheio { color: var(--mc); }
  .faixa { display: flex; flex-wrap: wrap; gap: 14px; background: var(--sup); border-radius: 12px; padding: 12px; align-items: center; }
  .abas { display: flex; justify-content: space-around; background: var(--sup); border-radius: 20px; padding: 10px 6px; margin-top: 10px; }
  .abas div { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 12px; color: var(--t2); min-width: 48px; }
  .abas div.ativa { color: var(--mc); font-weight: 600; }
  .ilus { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 8px; }
  .ilu { background: var(--sup); border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 6px; }
  .ilu .tam { display: flex; align-items: flex-end; gap: 10px; }
  .ilu .tile { background: var(--r-ilustracao-fundo); color: var(--r-ilustracao-traco); border-radius: 12px; display: grid; place-items: center; }
  .ilu small { font-size: 12px; color: var(--t2); }
  .linha-lista { display: flex; align-items: center; gap: 12px; background: var(--sup); border-radius: 14px; padding: 8px 12px 8px 8px; margin-top: 8px; }
  .linha-lista .tile { background: var(--r-ilustracao-fundo); color: var(--r-ilustracao-traco); border-radius: 12px; display: grid; place-items: center; width: 56px; height: 56px; flex: none; }
  .linha-lista strong { display: block; font-size: 16px; } .linha-lista span { font-size: 14px; color: var(--t2); }
</style>
</head>
