<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="Ícone do app Academia Plus">
  <title>Academia Plus — ícone do app (caminho A)</title>
  <!-- Fundo na cor de marca. iOS aplica a própria máscara; Android (ícone adaptativo) usa esta mesma arte sem o arredondamento, com o símbolo dentro da zona segura de 66%. -->
  <rect width="1024" height="1024" rx="224" fill="#007761"/>
  <g fill="#FFFFFF" transform="translate(512 512) scale(0.80) translate(-512 -512)">
    <rect x="96" y="352" width="120" height="320" rx="60"/>
    <rect x="808" y="352" width="120" height="320" rx="60"/>
    <rect x="180" y="452" width="664" height="120"/>
    <rect x="452" y="192" width="120" height="640" rx="60"/>
  </g>
</svg>
