<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="Academia Plus — símbolo barra e mais">
  <title>Academia Plus — caminho A: barra e mais</title>
  <!-- Um sinal de mais cujo braço horizontal é uma barra de academia: duas anilhas nas pontas. -->
  <g fill="#007761">
    <!-- anilhas -->
    <rect x="96" y="352" width="120" height="320" rx="60"/>
    <rect x="808" y="352" width="120" height="320" rx="60"/>
    <!-- barra -->
    <rect x="180" y="452" width="664" height="120"/>
    <!-- braço vertical do mais -->
    <rect x="452" y="192" width="120" height="640" rx="60"/>
  </g>
</svg>
